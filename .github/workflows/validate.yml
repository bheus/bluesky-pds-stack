name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # Portainer deploys this file alone with secrets from the stack env;
      # an empty env file reproduces everything except those secrets.
      - run: docker compose -f docker-compose.yml --env-file /dev/null config --quiet
